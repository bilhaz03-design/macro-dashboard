name: Swing Terminal Cloud Scanner

on:
  schedule:
    - cron: "3 7-21 * * 1-5"
    - cron: "33 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scanner mode to run"
        required: true
        default: "etf"
        type: choice
        options:
          - etf
          - stocks
          - all
      force:
        description: "Ignore market-hours guard for a manual smoke test"
        required: false
        default: false
        type: boolean
      no_notify:
        description: "Run without sending Telegram/macOS notifications"
        required: false
        default: false
        type: boolean

concurrency:
  group: swing-terminal-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SWING_TERMINAL_DASHBOARD_URL: ${{ secrets.SWING_TERMINAL_DASHBOARD_URL }}
      SWING_TERMINAL_CLOUD_RUN: "1"
      SWING_TERMINAL_ROOT: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-cloud.txt

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-cloud.txt

      - name: Select scan mode
        id: scan-mode
        shell: bash
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = "33 7-21 * * 1-5" ]; then
              mode="stocks"
            else
              mode="etf"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run cloud scanner
        shell: bash
        run: |
          args=(--mode "${{ steps.scan-mode.outputs.mode }}")
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${{ github.event.inputs.no_notify }}" = "true" ]; then
            args+=(--no-notify)
          fi
          python scripts/cloud_scan_worker.py "${args[@]}"
