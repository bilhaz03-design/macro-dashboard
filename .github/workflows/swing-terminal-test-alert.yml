name: Swing Terminal Test Alert

on:
  workflow_dispatch:
    inputs:
      no_notify:
        description: "Dry-run without sending Telegram"
        required: false
        default: false
        type: boolean

concurrency:
  group: swing-terminal-test-alert-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SWING_TERMINAL_DASHBOARD_URL: ${{ secrets.SWING_TERMINAL_DASHBOARD_URL }}
      SWING_TERMINAL_CLOUD_RUN: "1"
      SWING_TERMINAL_ROOT: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-cloud.txt

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-cloud.txt

      - name: Send controlled test alert
        shell: bash
        run: |
          args=(--mode test-alert --force)
          if [ "${{ github.event.inputs.no_notify }}" = "true" ]; then
            args+=(--no-notify)
          fi
          python scripts/cloud_scan_worker.py "${args[@]}"
