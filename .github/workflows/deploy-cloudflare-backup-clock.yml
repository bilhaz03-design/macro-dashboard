name: Deploy Cloudflare Backup Clock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test Worker logic
        run: node --test cloudflare/swing-terminal-backup-worker/test/index.test.mjs

      - name: Validate required deploy secrets
        shell: bash
        run: |
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CF_SUPABASE_URL \
            CF_SUPABASE_PUBLISHABLE_KEY \
            CF_SUPABASE_INGEST_TOKEN \
            CF_GITHUB_ACTIONS_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          CF_SUPABASE_URL: ${{ secrets.CF_SUPABASE_URL }}
          CF_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CF_SUPABASE_PUBLISHABLE_KEY }}
          CF_SUPABASE_INGEST_TOKEN: ${{ secrets.CF_SUPABASE_INGEST_TOKEN }}
          CF_GITHUB_ACTIONS_TOKEN: ${{ secrets.CF_GITHUB_ACTIONS_TOKEN }}

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Set Worker secrets
        shell: bash
        run: |
          printf '%s' "$CF_SUPABASE_URL" | wrangler secret put SUPABASE_URL --config cloudflare/swing-terminal-backup-worker/wrangler.toml
          printf '%s' "$CF_SUPABASE_PUBLISHABLE_KEY" | wrangler secret put SUPABASE_PUBLISHABLE_KEY --config cloudflare/swing-terminal-backup-worker/wrangler.toml
          printf '%s' "$CF_SUPABASE_INGEST_TOKEN" | wrangler secret put SUPABASE_INGEST_TOKEN --config cloudflare/swing-terminal-backup-worker/wrangler.toml
          printf '%s' "$CF_GITHUB_ACTIONS_TOKEN" | wrangler secret put GITHUB_ACTIONS_TOKEN --config cloudflare/swing-terminal-backup-worker/wrangler.toml
          if [ -n "$CF_ADMIN_TOKEN" ]; then
            printf '%s' "$CF_ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN --config cloudflare/swing-terminal-backup-worker/wrangler.toml
          fi
        env:
          CF_SUPABASE_URL: ${{ secrets.CF_SUPABASE_URL }}
          CF_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CF_SUPABASE_PUBLISHABLE_KEY }}
          CF_SUPABASE_INGEST_TOKEN: ${{ secrets.CF_SUPABASE_INGEST_TOKEN }}
          CF_GITHUB_ACTIONS_TOKEN: ${{ secrets.CF_GITHUB_ACTIONS_TOKEN }}
          CF_ADMIN_TOKEN: ${{ secrets.CF_ADMIN_TOKEN }}

      - name: Deploy Worker
        run: wrangler deploy --config cloudflare/swing-terminal-backup-worker/wrangler.toml
