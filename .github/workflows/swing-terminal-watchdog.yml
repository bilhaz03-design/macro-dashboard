name: Swing Terminal Cloud Watchdog

on:
  schedule:
    - cron: "28,58 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore watch window for a manual smoke test"
        required: false
        default: false
        type: boolean
      no_notify:
        description: "Run without sending Telegram notifications"
        required: false
        default: false
        type: boolean

concurrency:
  group: swing-terminal-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SWING_TERMINAL_DASHBOARD_URL: ${{ secrets.SWING_TERMINAL_DASHBOARD_URL }}
      SWING_TERMINAL_CLOUD_RUN: "1"
      SWING_TERMINAL_ROOT: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scanner heartbeat
        shell: bash
        run: |
          args=(
            --max-age-minutes 50
            --expect-mode etf:50
            --expect-mode stocks:130
            --dispatch-on-stale
            --heal-cooldown-minutes 45
          )
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            args+=(--force)
            args+=(--heal-force)
          fi
          if [ "${{ github.event.inputs.no_notify }}" = "true" ]; then
            args+=(--no-notify)
          fi
          python scripts/cloud_watchdog.py "${args[@]}"

      - name: Notify Telegram on watchdog workflow failure
        if: ${{ failure() && steps.checkout.outcome == 'success' && github.event.inputs.no_notify != 'true' }}
        shell: bash
        run: |
          python scripts/github_failure_notify.py \
            --workflow "Swing Terminal Cloud Watchdog" \
            --job "watchdog" \
            --mode "heartbeat" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --event "${{ github.event_name }}" \
            --actor "${{ github.actor }}" \
            --sha "${{ github.sha }}" \
            --extra "expected=etf:50,stocks:130"
